name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please don't report security vulnerabilities here; see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Copy an image in Preview
        2. Press ⌥⌘C
        3. …
    validations:
      required: true
  - type: input
    id: clipward-version
    attributes:
      label: Clipward version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: macos-version
    attributes:
      label: macOS version
      placeholder: "14.6"
    validations:
      required: true
  - type: dropdown
    id: chip
    attributes:
      label: Mac chip
      options:
        - Apple silicon
        - Intel
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots, the app you copied from, and so on.
